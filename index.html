<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport corregido para evitar zoom no deseado y asegurar ajuste perfecto al canvas/pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dossier160</title>
    
    <!-- PWA / Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0A3161">
    
    <!-- Compatibilidad iOS/Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="./css/diseno.css">

    <style>
        /* Estilos responsivos base */
        :root {
            --color-primario: #0A3161;
            --color-fondo: #f4f6f9;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            background-color: var(--color-fondo);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Contenedor principal responsive */
        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            background-color: var(--color-primario);
            color: #ffffff;
            text-align: center;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .content {
            flex: 1;
            width: 100%;
            max-width: 600px; /* Ancho máximo óptimo para legibilidad en pantallas grandes */
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Si se visualiza en una pantalla de escritorio grande, centra el contenido manteniendo diseño fluido */
        @media screen and (min-width: 768px) {
            .content {
                padding: 40px 20px;
            }
        }

        /* Ajustes específicos para móviles (9:16) */
        @media screen and (max-width: 480px) {
            #app {
                width: 100vw;
            }
            .content {
                max-width: 100%;
                padding: 15px;
            }
        }

        /* Modal centrado y responsivo */
        #customModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
    </style>
</head>
<body>

<div id="customModal" style="display:none;">
    <div class="modal-content">
        <h3>⚠️ Aviso</h3>
        <p id="modalMessage">Mensaje de error aquí</p>
        <div id="modalActions" style="margin-top: 15px;">
            <button onclick="cerrarModal()" style="background: var(--color-primario); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%;">Aceptar</button>
        </div>
    </div>
</div>

<div id="app">
    <div class="header">
        <h2 style="margin: 0;">Dossier160</h2>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>
    <div class="content" id="screenContent"></div>
</div>

<script src="./js/core.js"></script>
</body>
</html>
