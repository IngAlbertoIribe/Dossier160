<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport corregido para evitar zoom no deseado y asegurar ajuste perfecto al canvas/pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dossier160</title>
    
    <!-- PWA / Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0A3161">
    
    <!-- Compatibilidad iOS/Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="./css/diseno.css">

    </head>
<body>

<div id="customModal" style="display:none;">
    <div class="modal-content">
        <h3>⚠️ Aviso</h3>
        <p id="modalMessage">Mensaje de error aquí</p>
        <div id="modalActions" style="margin-top: 15px;">
            <button onclick="cerrarModal()" style="background: var(--color-primario); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%;">Aceptar</button>
        </div>
    </div>
</div>

<div id="app">
    <div class="header">
        <h2 style="margin: 0;">Dossier160</h2>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>
    <div class="content" id="screenContent"></div>
</div>

<script src="./js/core.js"></script>
</body>
</html>
