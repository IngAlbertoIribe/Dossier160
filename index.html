<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport 100% responsivo habilitado para zoom y accesibilidad -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title data-i18n="title">Dossier160</title>
    
    <!-- PWA / Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0A3161">
    
    <!-- Compatibilidad iOS/Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="icon" type="image/svg+xml" href="./dossier160.svg">
    
    <!-- RUTA CORREGIDA CON CARPETA CSS -->
    <link rel="stylesheet" href="./css/diseno.css">
</head>
<body>

<div id="customModal" style="display:none;">
    <div class="modal-content">
        <h3 data-i18n="modal_warning">⚠️ Aviso</h3>
        <p id="modalMessage" data-i18n="modal_default_msg">Mensaje de error aquí</p>
        <div id="modalActions" style="margin-top: 15px;">
            <button onclick="cerrarModal()" data-i18n="btn_accept">Aceptar</button>
        </div>
    </div>
</div>

<div id="app">
    <header class="header">
        <h2>Dossier160</h2>
        
        <!-- Selector de Idioma (Español / Inglés) -->
        <div class="lang-switch" style="position: absolute; top: 10px; right: 15px; display: flex; gap: 5px;">
            <button class="lang-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </header>
    <main class="content" id="screenContent"></main>
    <!-- NUEVO PIE DE PÁGINA (FOOTER GLOBAL) -->
    <footer class="no-print" style="background-color: var(--color-fondo); color: #777; text-align: center; padding: 15px 20px; font-size: 11px; border-top: 1px solid #ddd; margin-top: auto;">
        <p style="margin: 0; max-width: 800px; margin: 0 auto; line-height: 1.4;">
            <strong>Aviso / Disclaimer:</strong> Esta aplicación es una herramienta independiente y NO está afiliada, autorizada ni respaldada por ninguna entidad gubernamental. <br>
            <em>This app is an independent tool and is NOT affiliated with or endorsed by any government entity.</em>
        </p>
    </footer>
</div>

<!-- RUTA CORREGIDA CON CARPETA JS -->
<script src="./js/core.js"></script>
</body>
</html>
